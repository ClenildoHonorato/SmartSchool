version: '3.8'

services:
  smartschool-api:
    build:
      context: .
      dockerfile: SmartSchool.Api/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__default=Data Source=/app/data/SmartSchool.db
    volumes:
      - ./SmartSchool.Api/data:/app/data
    restart: unless-stopped
    networks:
      - smartschool-network

networks:
  smartschool-network:
    driver: bridge


