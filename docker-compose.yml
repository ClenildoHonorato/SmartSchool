version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: smartschool-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=smartschool
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartschool-network

  smartschool-api:
    build:
      context: .
      dockerfile: SmartSchool.Api/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__default=Server=mysql;Port=3306;Database=smartschool;User=root;Password=root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartschool-network

networks:
  smartschool-network:
    driver: bridge

volumes:
  mysql_data:
